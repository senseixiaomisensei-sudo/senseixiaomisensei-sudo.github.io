<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://postprep-text-gateway.postprep.workers.dev https://challenges.cloudflare.com http://127.0.0.1:* http://localhost:*; media-src 'self' blob: https://postprep-text-gateway.postprep.workers.dev; frame-src https://challenges.cloudflare.com; form-action 'self'">
  <meta name="description" content="AI 角色声音工作台 - 高保真 24kHz 声音克隆与文本朗读">
  <meta name="theme-color" content="#0F766E">
  <title>声音工坊 | AI 角色声音克隆</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
  <link rel="stylesheet" href="assets/postprep-tailwind.css?v=20260819-voice">
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/postprep-motion.css?v=20260819-voice">
  <style>
    .studio-glow {
      box-shadow: 0 0 50px -12px rgba(15, 118, 110, 0.15);
    }
    .dropzone-active {
      border-color: #0F766E !important;
      background-color: rgba(15, 118, 110, 0.04) !important;
    }
    .btn-gradient {
      background: linear-gradient(135deg, #0F766E 0%, #0d9488 100%);
    }
    .btn-gradient:hover {
      background: linear-gradient(135deg, #115E59 0%, #0F766E 100%);
    }
  </style>
</head>
<body class="bg-canvas text-ink antialiased selection:bg-teal-100 selection:text-teal-900" data-page="voice">
  <div id="site-header"></div>

  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12 lg:px-8">
    <!-- Header -->
    <header class="text-center max-w-2xl mx-auto">
      <div class="inline-flex items-center gap-2 rounded-full border border-teal-200/60 bg-teal-50/80 px-3.5 py-1 text-xs font-semibold text-teal-800 backdrop-blur-sm">
        <span class="flex h-2 w-2 rounded-full bg-teal-600 animate-pulse"></span>
        <span>24kHz 演播室级高清 · 零金属音 · 智能音色对齐</span>
      </div>
      <h1 class="mt-4 text-3xl font-extrabold tracking-tight text-zinc-900 sm:text-4xl">
        AI 角色声音工坊
      </h1>
      <p class="mt-3 text-base text-zinc-600 leading-relaxed">
        只需上传一段清晰的角色语音，输入任意台词，即可秒级生成 1:1 高保真自然朗读。
      </p>
    </header>

    <!-- Main Workspace Card -->
    <div class="mt-10 studio-glow rounded-2xl border border-zinc-200/80 bg-white p-6 sm:p-8 lg:p-10">
      <div class="grid gap-8 lg:grid-cols-2">
        
        <!-- Left Column: Audio Input -->
        <div class="flex flex-col justify-between space-y-6">
          <div>
            <div class="flex items-center justify-between">
              <label class="text-base font-bold text-zinc-900 flex items-center gap-2">
                <span class="flex h-6 w-6 items-center justify-center rounded-full bg-teal-100 text-xs font-bold text-teal-800">1</span>
                <span>参考角色音频</span>
              </label>
              <span id="audio-duration-badge" class="text-xs font-medium text-zinc-500 hidden"></span>
            </div>
            <p class="mt-1.5 text-xs text-zinc-500">
              推荐 3~30 秒清晰纯净人声（支持 WAV、MP3、M4A、OGG）
            </p>

            <!-- Dropzone -->
            <div id="dropzone" class="mt-4 relative flex flex-col items-center justify-center rounded-xl border-2 border-dashed border-zinc-300 bg-zinc-50/50 p-6 text-center transition-all hover:border-teal-500 hover:bg-teal-50/20 cursor-pointer group">
              <input id="reference-audio-input" type="file" accept=".wav,.mp3,.m4a,.ogg,audio/*" class="absolute inset-0 h-full w-full opacity-0 cursor-pointer z-10">
              
              <div id="dropzone-empty" class="space-y-3">
                <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-white shadow-sm border border-zinc-200 text-teal-600 group-hover:scale-110 transition-transform">
                  <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                </div>
                <div>
                  <p class="text-sm font-semibold text-zinc-800">点击上传 或 将音频拖拽至此</p>
                  <p class="mt-1 text-xs text-zinc-400">系统将自动进行 24kHz 降噪与干音提纯</p>
                </div>
              </div>

              <!-- Selected Audio Preview -->
              <div id="dropzone-selected" class="w-full space-y-3 hidden">
                <div class="flex items-center justify-between bg-white p-3 rounded-lg border border-zinc-200 shadow-sm">
                  <div class="flex items-center gap-3 overflow-hidden">
                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-teal-50 text-teal-700">
                      <i class="fa-solid fa-waveform-lines text-lg"></i>
                    </div>
                    <div class="min-w-0 text-left">
                      <p id="selected-filename" class="truncate text-sm font-semibold text-zinc-800">audio.wav</p>
                      <p id="selected-fileinfo" class="text-xs text-zinc-400">0.0 MB · 00:00</p>
                    </div>
                  </div>
                  <button id="btn-remove-audio" type="button" class="text-zinc-400 hover:text-rose-500 p-2 z-20 transition" title="重新选择">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
                <audio id="audio-preview" class="w-full h-8" controls preload="none"></audio>
              </div>
            </div>
          </div>

          <!-- Feature tags -->
          <div class="grid grid-cols-2 gap-3 pt-2">
            <div class="flex items-center gap-2 rounded-lg bg-zinc-50 p-2.5 text-xs text-zinc-600 border border-zinc-100">
              <i class="fa-solid fa-wand-magic-sparkles text-teal-600"></i>
              <span>智能干音降噪</span>
            </div>
            <div class="flex items-center gap-2 rounded-lg bg-zinc-50 p-2.5 text-xs text-zinc-600 border border-zinc-100">
              <i class="fa-solid fa-sparkles text-teal-600"></i>
              <span>自然度 1:1 还原</span>
            </div>
          </div>
        </div>

        <!-- Right Column: Text & Generation -->
        <div class="flex flex-col justify-between space-y-6">
          <div>
            <div class="flex items-center justify-between">
              <label for="voice-text" class="text-base font-bold text-zinc-900 flex items-center gap-2">
                <span class="flex h-6 w-6 items-center justify-center rounded-full bg-teal-100 text-xs font-bold text-teal-800">2</span>
                <span>输入台词文本</span>
              </label>
              <span id="char-count" class="text-xs font-medium text-zinc-400">0 / 1000 字</span>
            </div>
            <p class="mt-1.5 text-xs text-zinc-500">
              输入你想让角色说的话，支持标点符号与长句
            </p>

            <div class="mt-4 relative">
              <textarea id="voice-text" maxlength="1000" rows="6" class="w-full resize-none rounded-xl border border-zinc-200 bg-zinc-50/30 p-4 text-sm leading-relaxed text-zinc-900 placeholder:text-zinc-400 focus:border-teal-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-teal-600/10 transition" placeholder="在此输入想要合成的台词文本，例如：'你好呀，今天的天气真不错，要不要一起出去走走？'"></textarea>
              
              <!-- Quick presets -->
              <div class="mt-2 flex flex-wrap items-center gap-2">
                <span class="text-xs text-zinc-400">快捷范例:</span>
                <button type="button" class="btn-sample text-xs bg-zinc-100 hover:bg-teal-50 hover:text-teal-700 text-zinc-600 px-2.5 py-1 rounded-md transition" data-sample="你好呀，欢迎来到我的个人世界！今天也是充满希望的一天呢。">日常打招呼</button>
                <button type="button" class="btn-sample text-xs bg-zinc-100 hover:bg-teal-50 hover:text-teal-700 text-zinc-600 px-2.5 py-1 rounded-md transition" data-sample="警告！侦测到前方高能反应，全体成员请立即进入一级战斗准备状态！">游戏台词</button>
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button id="btn-generate" type="button" class="btn-gradient w-full py-3.5 px-6 rounded-xl font-bold text-white shadow-md shadow-teal-700/20 hover:shadow-lg hover:shadow-teal-700/30 active:scale-[0.99] transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="fa-solid fa-play text-sm"></i>
              <span id="btn-generate-text">立即生成高保真音频</span>
            </button>
            <p id="status-msg" class="mt-2 text-center text-xs text-zinc-400 min-h-4"></p>
          </div>
        </div>

      </div>

      <!-- Result Card -->
      <div id="result-card" class="mt-8 pt-8 border-t border-zinc-100 hidden">
        <div class="rounded-xl border border-teal-200 bg-gradient-to-r from-teal-50/60 to-emerald-50/60 p-5 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
          <div class="flex items-center gap-4 w-full sm:w-auto">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-teal-600 text-white shadow-sm">
              <i class="fa-solid fa-circle-check text-xl"></i>
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <h3 class="text-sm font-bold text-zinc-900">音频生成成功</h3>
                <span class="rounded-full bg-teal-600/10 px-2 py-0.5 text-[10px] font-bold text-teal-700">24kHz 高保真</span>
              </div>
              <p id="result-info" class="text-xs text-zinc-500 mt-0.5">无杂音 · 原声还原</p>
            </div>
          </div>

          <!-- Audio Player & Action -->
          <div class="flex items-center gap-3 w-full sm:w-auto flex-1 max-w-md justify-end">
            <audio id="result-audio" class="w-full max-w-xs h-10" controls preload="auto"></audio>
            <a id="btn-download" href="#" download="ai-character-voice.wav" class="inline-flex shrink-0 items-center gap-2 rounded-lg bg-white border border-teal-600 px-4 py-2 text-xs font-bold text-teal-700 hover:bg-teal-600 hover:text-white shadow-sm transition">
              <i class="fa-solid fa-download"></i>
              <span>下载 WAV</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-50 w-[calc(100%-2rem)] max-w-md -translate-x-1/2 translate-y-3 rounded-lg bg-zinc-900 px-4 py-3 text-center text-sm font-semibold text-white opacity-0 shadow-xl transition-all duration-200 sm:w-auto" role="status" aria-live="polite"></div>

  <script src="assets/postprep-config.js"></script>
  <script src="assets/postprep.js?v=20260819-voice"></script>
  <script src="assets/voice-studio.js?v=20260819-voice"></script>
</body>
</html>
