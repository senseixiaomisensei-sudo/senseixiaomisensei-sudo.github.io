name = "postprep-text-gateway"
main = "api-gateway.js"
compatibility_date = "2026-08-12"
workers_dev = true

[vars]
POSTPREP_UPSTREAM_URL = "https://postprep-ae6.pages.dev/api/text"
POSTPREP_RVC_UPSTREAM_URL = "https://postprep-ae6.pages.dev/api/rvc"
POSTPREP_RVC_STATUS_UPSTREAM_URL = "https://postprep-ae6.pages.dev/api/rvc-status"
POSTPREP_RVC_MODELS_UPSTREAM_URL = "https://postprep-ae6.pages.dev/api/rvc-models"
POSTPREP_RVC_OUTPUT_UPSTREAM_URL = "https://postprep-ae6.pages.dev/api/rvc-output"

[[ratelimits]]
name = "POSTPREP_RATE_LIMITER"
namespace_id = "2026081201"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "POSTPREP_RVC_RATE_LIMITER"
namespace_id = "2026081501"

  [ratelimits.simple]
  limit = 1
  period = 60
