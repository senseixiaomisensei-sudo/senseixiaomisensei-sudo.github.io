<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PostPrep 按平台生成文案：输入主题、标题或标签，生成可继续编辑的文案或标签。">
  <title>按平台生成文案 | PostPrep</title>
  <link rel="stylesheet" href="assets/postprep-tailwind.css">
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/postprep-motion.css">
</head>
<body class="bg-canvas text-ink antialiased" data-page="generator" data-title-key="generator.title">
  <div id="site-header"></div>
  <main class="mx-auto max-w-6xl px-4 py-12 sm:px-6 lg:px-8">
    <header class="max-w-3xl">
      <p class="text-xs font-bold uppercase tracking-[0.18em] text-brand" data-i18n="generator.eyebrow">PLATFORM CONTENT GENERATOR</p>
      <h1 class="mt-3 text-3xl font-black tracking-tight sm:text-4xl" data-i18n="generator.title">按平台生成文案</h1>
      <p class="mt-3 text-base leading-7 text-muted" data-i18n="generator.intro">输入一句主题、标题或几个标签，选择发布平台和要生成的内容，就能得到可继续编辑的初稿。</p>
    </header>

    <div class="mt-10 grid gap-6 lg:grid-cols-[minmax(0,0.9fr)_minmax(0,1.1fr)]">
      <section class="rounded-lg border border-line bg-surface p-5 shadow-sm sm:p-7">
        <div>
          <label class="text-sm font-bold" data-i18n="generator.platformLabel">发布位置</label>
          <div id="generator-platform-list" class="mt-3 flex flex-wrap gap-2" role="group" data-i18n-aria-label="generator.platformLabel" aria-label="发布位置"></div>
        </div>

        <div class="mt-7 border-t border-line pt-6">
          <label class="text-sm font-bold" data-i18n="generator.typeLabel">生成内容</label>
          <div id="generator-type-list" class="mt-3 flex flex-wrap gap-2" role="group" data-i18n-aria-label="generator.typeLabel" aria-label="生成内容"></div>
        </div>

        <div class="mt-7 border-t border-line pt-6">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <div>
              <label for="generator-input" class="text-sm font-bold" data-i18n="generator.inputLabel">你想写什么</label>
              <p class="mt-1 text-xs leading-5 text-muted" data-i18n="generator.inputHint">一句标题、主题、卖点或 1–3 个标签即可；生成前请确认事实准确。</p>
            </div>
            <button id="generator-clear" type="button" class="inline-flex min-h-10 items-center gap-2 rounded-lg border border-line px-3 py-2 text-sm font-semibold text-ink transition hover:border-rose-300 hover:text-rose-700 focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2"><i class="fa-solid fa-eraser" aria-hidden="true"></i><span data-i18n="generator.clear">清空主题</span></button>
          </div>
          <textarea id="generator-input" maxlength="500" class="mt-3 min-h-48 w-full resize-y rounded-lg border-line bg-white px-4 py-3 text-base leading-7 text-ink shadow-sm placeholder:text-zinc-400 focus:border-brand focus:ring-brand" data-i18n-placeholder="generator.inputPlaceholder" placeholder="例如：周末去江苏看初雪"></textarea>
          <button id="generator-action" type="button" class="cloud-action-button mt-5 inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-lg bg-brand px-5 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-brandDark focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2" aria-busy="false"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span id="generator-action-label" data-i18n="generator.generate">开始生成</span></button>
        </div>
      </section>

      <section class="rounded-lg border border-line bg-surface p-5 shadow-sm sm:p-7">
        <div class="flex flex-wrap items-start justify-between gap-3 border-b border-line pb-5">
          <div>
            <p class="text-xs font-bold uppercase tracking-[0.14em] text-brand" data-i18n="generator.selected">当前选择</p>
            <p id="generator-selected-meta" class="mt-2 text-lg font-black">小红书 · 生成文案</p>
          </div>
          <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-teal-50 text-brand" aria-hidden="true"><i class="fa-solid fa-sparkles"></i></div>
        </div>

        <div class="mt-6">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <div>
              <label for="generator-output" class="text-sm font-bold" data-i18n="generator.resultLabel">生成结果</label>
              <p class="mt-1 text-xs leading-5 text-muted" data-i18n="generator.resultHint">结果会结合所选平台的表达方式；发布前请按实际情况调整。</p>
            </div>
            <button type="button" data-copy-from="generator-output" class="inline-flex min-h-10 items-center gap-2 rounded-lg border border-line px-3 py-2 text-sm font-bold text-ink transition hover:border-brand hover:text-brand focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2"><i class="fa-regular fa-copy" aria-hidden="true"></i><span data-i18n="shared.copy">复制</span></button>
          </div>
          <textarea id="generator-output" readonly class="mt-3 min-h-80 w-full resize-y rounded-lg border border-line bg-canvas px-4 py-3 text-base leading-7 text-ink shadow-sm placeholder:text-zinc-400 focus:border-brand focus:ring-brand" data-i18n-placeholder="generator.resultPlaceholder" placeholder="选择平台并输入主题后，点击开始生成" aria-live="polite"></textarea>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-50 -translate-x-1/2 translate-y-3 rounded-lg bg-ink px-4 py-3 text-sm font-semibold text-white opacity-0 shadow-xl transition-all duration-200" role="status" aria-live="polite"></div>
  <script src="assets/postprep-config.js"></script>
  <script src="assets/postprep.js"></script>
</body>
</html>
